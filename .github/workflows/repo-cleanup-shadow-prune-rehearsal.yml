name: Repo cleanup shadow-prune recovery rehearsal

on:
  push:
    branches:
      - maintenance/repo-cleanup-adaptation-2026-09-09
    paths:
      - .github/workflows/repo-cleanup-shadow-prune-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    env:
      CANONICAL_REF: refs/heads/main
      CANONICAL_SHA: b0eac372035ca12a63f808eb3201edd3605a163c
      ARCHIVE_REF: refs/heads/archive/pre-cleanup-2026-09-09-dca388f4
      ARCHIVE_BRANCH: archive/pre-cleanup-2026-09-09-dca388f4
      ARCHIVE_SHA: fd5cae330fb80280617ce7b241347f1edafdb875
      HELPER_REF: refs/heads/maintenance/repo-cleanup-adaptation-2026-09-09
      EXPECTED_FREEZE_SHA: dca388f456480489492ea2069c2ce8ecd5930d3ab41028cda88f25fe72cc9584
      EXPECTED_HISTORICAL_BRANCHES: '86'
      EXPECTED_DISTINCT_TIPS: '75'
      ACCIDENTAL_ALIAS_SHA: 452f7b51a7e1b46b08ea74a21affeec33dbe0216

    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch complete remote branch graph and PR heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head'
          git fetch --tags --force origin || true

      - name: Materialize frozen recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/repo-cleanup/shadow-rehearsal
          git show "refs/remotes/origin/${ARCHIVE_BRANCH}:archive/recovery-manifest.json" \
            > evidence/repo-cleanup/shadow-rehearsal/recovery-manifest.json

      - name: Build isolated bare shadow from remote heads only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/repo-cleanup-shadow.git /tmp/repo-cleanup-reclone /tmp/repo-cleanup-bundle-clone
          git init --bare /tmp/repo-cleanup-shadow.git
          git --git-dir=/tmp/repo-cleanup-shadow.git fetch --force --no-tags "$GITHUB_WORKSPACE/.git" \
            '+refs/remotes/origin/*:refs/heads/*'
          # origin/HEAD is a local symbolic convenience, not a real remote branch.
          git --git-dir=/tmp/repo-cleanup-shadow.git update-ref -d refs/heads/HEAD || true
          git --git-dir=/tmp/repo-cleanup-shadow.git fetch --force "$GITHUB_WORKSPACE/.git" \
            '+refs/tags/*:refs/tags/*' || true
          git --git-dir=/tmp/repo-cleanup-shadow.git symbolic-ref HEAD refs/heads/main

      - name: Simulate frozen prune, namespace closure, aggressive GC and exact recovery
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const repo = '/tmp/repo-cleanup-shadow.git';
          const manifestPath = 'evidence/repo-cleanup/shadow-rehearsal/recovery-manifest.json';
          const outPath = 'evidence/repo-cleanup/shadow-rehearsal/shadow-rehearsal.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const expectedCanonical = process.env.CANONICAL_SHA;
          const expectedArchive = process.env.ARCHIVE_SHA;
          const expectedFreeze = process.env.EXPECTED_FREEZE_SHA;
          const helperSha = process.env.GITHUB_SHA;
          const accidentalAliasSha = process.env.ACCIDENTAL_ALIAS_SHA;
          const accidentalAliasRefs = [
            'refs/heads/maintenance/repo-cleanup-shadow-rehearsal-2026-09-10',
            'refs/heads/maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-backup',
            'refs/heads/maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-final',
            'refs/heads/maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-run',
            'refs/heads/maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-v2',
            'refs/heads/maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-v3',
            'refs/heads/maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-v4',
          ].sort();

          const run = (args, allowFailure = false) => {
            const r = spawnSync('git', [`--git-dir=${repo}`, ...args], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
            if (r.status !== 0 && !allowFailure) throw new Error(`git ${args.join(' ')} failed: ${r.stderr || r.stdout}`);
            return r;
          };
          const resolve = (ref) => {
            const r = run(['rev-parse', '--verify', ref], true);
            return r.status === 0 ? r.stdout.trim() : null;
          };
          const heads = () => run(['for-each-ref', '--format=%(refname)', 'refs/heads/']).stdout.trim().split('\n').filter(Boolean).sort();
          const assert = (x, m) => { if (!x) throw new Error(m); };
          const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          const sha256 = (text) => crypto.createHash('sha256').update(text).digest('hex');

          assert(manifest.historicalArchiveFreezeSha256 === expectedFreeze, 'freeze hash mismatch');
          assert(manifest.canonicalSha === expectedCanonical, 'canonical manifest SHA mismatch');
          assert(manifest.historicalBranches.length === Number(process.env.EXPECTED_HISTORICAL_BRANCHES), 'historical branch count mismatch');
          assert(manifest.historicalArchiveTipShas.length === Number(process.env.EXPECTED_DISTINCT_TIPS), 'distinct tip count mismatch');
          assert(resolve(process.env.CANONICAL_REF) === expectedCanonical, 'shadow canonical mismatch');
          assert(resolve(process.env.ARCHIVE_REF) === expectedArchive, 'shadow archive mismatch');
          assert(resolve(process.env.HELPER_REF) === helperSha, 'shadow helper mismatch');

          const historicalRefs = manifest.historicalBranches.map(e => e.ref).sort();
          assert(new Set(historicalRefs).size === historicalRefs.length, 'manifest historical ref duplication');

          const parentLine = run(['rev-list', '--parents', '-n', '1', expectedArchive]).stdout.trim().split(/\s+/);
          const archiveParents = parentLine.slice(1);
          assert(same(archiveParents, manifest.archiveAnchorParentShas), 'archive parent vector differs from manifest');

          const beforeTrees = new Map();
          const liveExact = [];
          const alreadyAbsent = [];
          for (const entry of manifest.historicalBranches) {
            const actual = resolve(entry.ref);
            if (actual === null) alreadyAbsent.push(entry.ref);
            else {
              assert(actual === entry.expectedSha, `pre-simulation CAS mismatch ${entry.ref}: ${actual}`);
              liveExact.push(entry.ref);
            }
            beforeTrees.set(entry.ref, run(['rev-parse', `${entry.expectedSha}^{tree}`]).stdout.trim());
          }
          assert(liveExact.length === 85, `expected 85 exact live historical refs, got ${liveExact.length}`);
          assert(same(alreadyAbsent.sort(), ['refs/heads/tmp-noop']), `unexpected absent historical refs: ${alreadyAbsent.join(',')}`);

          for (const ref of accidentalAliasRefs) {
            assert(resolve(ref) === accidentalAliasSha, `accidental alias mismatch ${ref}: ${resolve(ref)}`);
          }

          // Phase A: simulate exactly the original frozen operation, nothing more.
          for (const entry of manifest.historicalBranches) {
            const actual = resolve(entry.ref);
            if (actual !== null) run(['update-ref', '-d', entry.ref, entry.expectedSha]);
          }
          const historicalStillLive = historicalRefs.filter(ref => resolve(ref) !== null);
          assert(historicalStillLive.length === 0, `frozen refs survived local prune: ${historicalStillLive.join(',')}`);

          const expectedAfterFrozen = [process.env.CANONICAL_REF, process.env.ARCHIVE_REF, process.env.HELPER_REF, ...accidentalAliasRefs].sort();
          const headsAfterFrozen = heads();
          assert(same(headsAfterFrozen, expectedAfterFrozen), `post-frozen namespace mismatch: ${JSON.stringify(headsAfterFrozen)}`);

          // Phase B: simulate a separately authorized terminal disposition for the seven accidental aliases.
          for (const ref of accidentalAliasRefs) {
            assert(resolve(ref) === accidentalAliasSha, `alias moved before closure ${ref}`);
            run(['update-ref', '-d', ref, accidentalAliasSha]);
            assert(resolve(ref) === null, `alias local closure failed ${ref}`);
          }
          const expectedClosureHeads = [process.env.CANONICAL_REF, process.env.ARCHIVE_REF, process.env.HELPER_REF].sort();
          const headsAfterNamespaceClosure = heads();
          assert(same(headsAfterNamespaceClosure, expectedClosureHeads), `namespace closure mismatch: ${JSON.stringify(headsAfterNamespaceClosure)}`);

          run(['reflog', 'expire', '--expire=now', '--all'], true);
          run(['gc', '--prune=now', '--aggressive']);
          const fsck = run(['fsck', '--full', '--no-reflogs'], true);
          assert(fsck.status === 0, `shadow fsck failed: ${fsck.stderr || fsck.stdout}`);

          for (const sha of manifest.historicalArchiveTipShas) {
            assert(run(['cat-file', '-t', sha]).stdout.trim() === 'commit', `archive tip vanished after GC ${sha}`);
          }
          for (const entry of manifest.historicalBranches) {
            assert(run(['cat-file', '-t', entry.expectedSha]).stdout.trim() === 'commit', `historical commit vanished after GC ${entry.ref}`);
            assert(run(['rev-parse', `${entry.expectedSha}^{tree}`]).stdout.trim() === beforeTrees.get(entry.ref), `tree identity changed ${entry.ref}`);
          }

          let restored = 0;
          for (const entry of manifest.historicalBranches) {
            assert(resolve(entry.ref) === null, `unexpected historical ref before restore ${entry.ref}`);
            run(['update-ref', entry.ref, entry.expectedSha]);
            assert(resolve(entry.ref) === entry.expectedSha, `exact recovery failed ${entry.ref}`);
            run(['update-ref', '-d', entry.ref, entry.expectedSha]);
            assert(resolve(entry.ref) === null, `cleanup after recovery test failed ${entry.ref}`);
            restored += 1;
          }

          const archiveManifestText = run(['show', `${process.env.ARCHIVE_REF}:archive/recovery-manifest.json`]).stdout;
          assert(JSON.parse(archiveManifestText).historicalArchiveFreezeSha256 === expectedFreeze, 'archive manifest unreadable after GC');

          const report = {
            schema: 'box3d-character-controller-shadow-prune-rehearsal-v2',
            status: 'PASS_LOCAL_FROZEN_PRUNE_NAMESPACE_CLOSURE_GC_AND_EXACT_RECOVERY',
            remoteMutations: 0,
            helperSha,
            canonical: { ref: process.env.CANONICAL_REF, sha: expectedCanonical },
            archive: { ref: process.env.ARCHIVE_REF, sha: expectedArchive, parentCount: archiveParents.length },
            historicalBranchCount: manifest.historicalBranches.length,
            historicalDistinctTipCount: manifest.historicalArchiveTipShas.length,
            preSimulationLiveExactCount: liveExact.length,
            preSimulationAlreadyAbsentCount: alreadyAbsent.length,
            preSimulationAlreadyAbsent: alreadyAbsent,
            frozenHistoricalRefsStillLiveAfterPrune: historicalStillLive,
            headsAfterFrozenPrune: headsAfterFrozen,
            accidentalAliasRefs,
            accidentalAliasExpectedSha: accidentalAliasSha,
            headsAfterNamespaceClosure,
            aggressiveGcPerformed: true,
            fsckExitCode: fsck.status,
            exactBranchRestoreTests: restored,
            archiveManifestSha256: sha256(archiveManifestText),
          };
          fs.writeFileSync(outPath, `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report));
          NODE

      - name: Fresh-clone negative-control and history-transfer proof
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-local /tmp/repo-cleanup-shadow.git /tmp/repo-cleanup-reclone
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const manifest = JSON.parse(fs.readFileSync('evidence/repo-cleanup/shadow-rehearsal/recovery-manifest.json', 'utf8'));
          const reportPath = 'evidence/repo-cleanup/shadow-rehearsal/shadow-rehearsal.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const run = (args) => {
            const r = spawnSync('git', ['-C', '/tmp/repo-cleanup-reclone', ...args], { encoding: 'utf8' });
            if (r.status !== 0) throw new Error(`git ${args.join(' ')} failed: ${r.stderr || r.stdout}`);
            return r.stdout.trim();
          };
          for (const sha of manifest.historicalArchiveTipShas) {
            if (run(['cat-file', '-t', sha]) !== 'commit') throw new Error(`fresh clone lacks historical tip ${sha}`);
          }
          const remoteBranches = run(['for-each-ref', '--format=%(refname)', 'refs/remotes/origin/']).split('\n').filter(Boolean);
          const historicalNames = new Set(manifest.historicalBranches.map(e => `refs/remotes/origin/${e.ref.replace(/^refs\/heads\//, '')}`));
          const leakedHistoricalNames = remoteBranches.filter(ref => historicalNames.has(ref));
          if (leakedHistoricalNames.length) throw new Error(`fresh clone advertises pruned historical names: ${leakedHistoricalNames.join(',')}`);
          const aliasNames = new Set(report.accidentalAliasRefs.map(ref => `refs/remotes/origin/${ref.replace(/^refs\/heads\//, '')}`));
          const leakedAliasNames = remoteBranches.filter(ref => aliasNames.has(ref));
          if (leakedAliasNames.length) throw new Error(`fresh clone advertises closed accidental aliases: ${leakedAliasNames.join(',')}`);
          report.freshCloneHistoricalTipChecks = manifest.historicalArchiveTipShas.length;
          report.freshClonePrunedHistoricalNamesVisible = leakedHistoricalNames.length;
          report.freshCloneAccidentalAliasNamesVisible = leakedAliasNames.length;
          report.freshCloneStatus = 'PASS_HISTORY_TRANSFERS_WITHOUT_PRUNED_OR_ACCIDENTAL_BRANCH_NAMES';
          fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
          console.log(`FRESH_CLONE_PASS tips=${report.freshCloneHistoricalTipChecks} oldNames=${report.freshClonePrunedHistoricalNamesVisible} aliasNames=${report.freshCloneAccidentalAliasNamesVisible}`);
          NODE

      - name: Build and verify self-contained pre-prune recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=evidence/repo-cleanup/shadow-rehearsal/pre-prune-recovery.bundle
          git --git-dir=/tmp/repo-cleanup-shadow.git bundle create "$GITHUB_WORKSPACE/$BUNDLE" \
            refs/heads/main \
            "refs/heads/${ARCHIVE_BRANCH}"
          git --git-dir=/tmp/repo-cleanup-shadow.git bundle verify "$GITHUB_WORKSPACE/$BUNDLE" \
            > evidence/repo-cleanup/shadow-rehearsal/bundle-verify.txt 2>&1
          git bundle list-heads "$BUNDLE" > evidence/repo-cleanup/shadow-rehearsal/bundle-heads.txt
          sha256sum "$BUNDLE" > evidence/repo-cleanup/shadow-rehearsal/bundle.sha256
          stat --printf='%s\n' "$BUNDLE" > evidence/repo-cleanup/shadow-rehearsal/bundle-size-bytes.txt
          rm -rf /tmp/repo-cleanup-bundle-clone
          git clone --no-local --branch main "$BUNDLE" /tmp/repo-cleanup-bundle-clone
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const manifest = JSON.parse(fs.readFileSync('evidence/repo-cleanup/shadow-rehearsal/recovery-manifest.json', 'utf8'));
          const reportPath = 'evidence/repo-cleanup/shadow-rehearsal/shadow-rehearsal.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const cwd = '/tmp/repo-cleanup-bundle-clone';
          const run = (args, allowFailure = false) => {
            const r = spawnSync('git', ['-C', cwd, ...args], { encoding: 'utf8' });
            if (r.status !== 0 && !allowFailure) throw new Error(`git ${args.join(' ')} failed: ${r.stderr || r.stdout}`);
            return r;
          };
          for (const sha of manifest.historicalArchiveTipShas) {
            if (run(['cat-file', '-t', sha]).stdout.trim() !== 'commit') throw new Error(`bundle clone lacks historical tip ${sha}`);
          }
          let restored = 0;
          for (const entry of manifest.historicalBranches) {
            run(['update-ref', entry.ref, entry.expectedSha]);
            const actual = run(['rev-parse', '--verify', entry.ref]).stdout.trim();
            if (actual !== entry.expectedSha) throw new Error(`bundle exact restore failed ${entry.ref}`);
            run(['update-ref', '-d', entry.ref, entry.expectedSha]);
            restored += 1;
          }
          const bundleHeads = fs.readFileSync('evidence/repo-cleanup/shadow-rehearsal/bundle-heads.txt', 'utf8').trim().split('\n').filter(Boolean);
          const bundleSha256 = fs.readFileSync('evidence/repo-cleanup/shadow-rehearsal/bundle.sha256', 'utf8').trim().split(/\s+/)[0];
          const bundleSizeBytes = Number(fs.readFileSync('evidence/repo-cleanup/shadow-rehearsal/bundle-size-bytes.txt', 'utf8').trim());
          report.bundle = {
            selfContained: true,
            heads: bundleHeads,
            sha256: bundleSha256,
            sizeBytes: bundleSizeBytes,
            historicalTipChecks: manifest.historicalArchiveTipShas.length,
            exactBranchRestoreTests: restored,
            status: 'PASS_SELF_CONTAINED_BUNDLE_CLONE_AND_EXACT_RECOVERY',
          };
          fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
          console.log(`BUNDLE_PASS size=${bundleSizeBytes} sha256=${bundleSha256} tips=${report.bundle.historicalTipChecks} restores=${restored}`);
          NODE

      - name: Record immutable-release observability boundary
        shell: bash
        run: |
          cat > evidence/repo-cleanup/shadow-rehearsal/immutable-release-observability.json <<'JSON'
          {
            "status": "UNOBSERVABLE_FROM_CURRENT_ACTION_TOKEN",
            "reason": "GitHub GET /repos/{owner}/{repo}/immutable-releases requires Administration: read. GITHUB_TOKEN does not expose repository Administration scope, and the connected GitHub tool currently does not expose this endpoint.",
            "mutationPerformed": false
          }
          JSON

      - name: Upload rehearsal evidence and experimental recovery capsule
        uses: actions/upload-artifact@v4
        with:
          name: repo-cleanup-shadow-prune-rehearsal
          path: evidence/repo-cleanup/shadow-rehearsal/
          if-no-files-found: error
