name: R4 A5 query semantics design

on:
  push:
    branches:
      - research/donor-foundation-repair-a5-query-design-2026-09-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify explicit query semantics contract
        run: node scripts/r4-a5-query-semantics-contract.mjs
      - name: Canonical smoke
        run: npm run smoke
      - name: Build runtime
        run: npm run build
