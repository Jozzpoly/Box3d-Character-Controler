name: Repo cleanup Gate 1 classification

on:
  push:
    branches:
      - maintenance/repo-cleanup-adaptation-2026-09-09
    paths:
      - scripts/repo-cleanup-gate1-classify.mjs
      - scripts/repo-cleanup-gate1-plan.mjs
      - scripts/repo-cleanup-archive-qualify.mjs
      - .github/workflows/repo-cleanup-gate1-classify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current maintenance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch complete branch and PR-head ref graph
        run: |
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Classify complete live ref forest read-only
        env:
          CLEANUP_CANONICAL_REF: main
        run: |
          mkdir -p evidence/repo-cleanup
          node scripts/repo-cleanup-gate1-classify.mjs \
            --out=evidence/repo-cleanup/gate1-classification.json

      - name: Generate deterministic preliminary plan
        env:
          CLEANUP_ACTIVE_BRANCH: maintenance/repo-cleanup-adaptation-2026-09-09
        run: |
          node scripts/repo-cleanup-gate1-plan.mjs \
            --in=evidence/repo-cleanup/gate1-classification.json \
            --out=evidence/repo-cleanup/gate1-preliminary-plan.json

      - name: Qualify exact archive anchor locally without remote write
        run: |
          node scripts/repo-cleanup-archive-qualify.mjs \
            --plan=evidence/repo-cleanup/gate1-preliminary-plan.json \
            --out=evidence/repo-cleanup/archive-anchor-qualification.json

      - name: Upload Gate 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: repo-cleanup-gate1-evidence
          path: |
            evidence/repo-cleanup/gate1-classification.json
            evidence/repo-cleanup/gate1-preliminary-plan.json
            evidence/repo-cleanup/archive-anchor-qualification.json
          if-no-files-found: error
