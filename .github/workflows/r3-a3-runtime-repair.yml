name: R3 A3 runtime repair

on:
  push:
    branches:
      - research/donor-foundation-repair-a3-2026-09-11
    paths:
      - src/constraint-velocity-character.js
      - scripts/r3-a3-runtime-repair-crucible.mjs
      - scripts/r3-a3-runtime-repair-stress.mjs
      - .github/workflows/r3-a3-runtime-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Qualify A3 and A3b repair against historical v0 witness
        run: node scripts/r3-a3-runtime-repair-crucible.mjs
      - name: Stress broader support motion envelope
        run: node scripts/r3-a3-runtime-repair-stress.mjs
      - name: Canonical smoke
        run: npm run smoke
      - name: Build runtime
        run: npm run build
