name: Repo cleanup one-ref canary delete

on:
  push:
    branches:
      - maintenance/repo-cleanup-adaptation-2026-09-09
    paths:
      - .github/workflows/repo-cleanup-canary-delete.yml

permissions:
  contents: write

concurrency:
  group: repo-cleanup-one-ref-canary-delete
  cancel-in-progress: false

jobs:
  delete-canary:
    runs-on: ubuntu-latest
    env:
      CANARY_REF: refs/heads/tmp-noop
      CANARY_SHA: 2f341aed904ecdccf61b1264a77f849aeaa236fd
      CANONICAL_REF: refs/heads/main
      CANONICAL_SHA: b0eac372035ca12a63f808eb3201edd3605a163c
      ARCHIVE_REF: refs/heads/archive/pre-cleanup-2026-09-09-dca388f4
      ARCHIVE_SHA: fd5cae330fb80280617ce7b241347f1edafdb875
      ARCHIVE_BRANCH: archive/pre-cleanup-2026-09-09-dca388f4
      EXPECTED_FREEZE_SHA: dca388f456480489492ea2069c2ce8ecd5930d3ab41028cda88f25fe72cc9584
      EXPECTED_HISTORICAL_BRANCHES: '86'
      EXPECTED_HISTORICAL_TIPS: '75'
      EXPECTED_ANCHOR_PARENTS: '76'
      CLEANUP_CANONICAL_REF: main
      CLEANUP_ACTIVE_BRANCH: maintenance/repo-cleanup-adaptation-2026-09-09
      CLEANUP_ARCHIVE_BRANCH: archive/pre-cleanup-2026-09-09-dca388f4

    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_sha() { git ls-remote --heads origin "$1" | awk '{print $1}'; }
          test "$(remote_sha "$CANONICAL_REF")" = "$CANONICAL_SHA"
          test "$(remote_sha "$ARCHIVE_REF")" = "$ARCHIVE_SHA"
          test "$(remote_sha "$CANARY_REF")" = "$CANARY_SHA"

          git fetch --no-tags origin "+${ARCHIVE_REF}:refs/remotes/origin/${ARCHIVE_BRANCH}"
          git show "refs/remotes/origin/${ARCHIVE_BRANCH}:archive/recovery-manifest.json" > /tmp/recovery-manifest.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('/tmp/recovery-manifest.json', 'utf8'));
          if (m.historicalArchiveFreezeSha256 !== process.env.EXPECTED_FREEZE_SHA) throw new Error('freeze mismatch');
          const e = m.historicalBranches.find(x => x.ref === process.env.CANARY_REF);
          if (!e || e.expectedSha !== process.env.CANARY_SHA) throw new Error('canary not covered exactly by frozen archive manifest');
          NODE

      - name: Delete exactly one leased canary ref
        shell: bash
        run: |
          set -euo pipefail
          git push --atomic \
            --force-with-lease="${CANARY_REF}:${CANARY_SHA}" \
            origin ":${CANARY_REF}"

      - name: Immediate remote postflight
        shell: bash
        run: |
          set -euo pipefail
          remote_sha() { git ls-remote --heads origin "$1" | awk '{print $1}'; }
          test -z "$(remote_sha "$CANARY_REF")"
          test "$(remote_sha "$CANONICAL_REF")" = "$CANONICAL_SHA"
          test "$(remote_sha "$ARCHIVE_REF")" = "$ARCHIVE_SHA"

      - name: Full cleanup-policy postflight
        shell: bash
        env:
          EXPECTED_CANONICAL_SHA: b0eac372035ca12a63f808eb3201edd3605a163c
          EXPECTED_ARCHIVE_SHA: fd5cae330fb80280617ce7b241347f1edafdb875
          EXPECTED_HELPER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/repo-cleanup/canary
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head'
          git show "refs/remotes/origin/${ARCHIVE_BRANCH}:archive/recovery-manifest.json" > evidence/repo-cleanup/canary/remote-recovery-manifest.json
          node scripts/repo-cleanup-gate1-classify.mjs --out=evidence/repo-cleanup/canary/live-classification.json
          node scripts/repo-cleanup-delete-preflight.mjs \
            --manifest=evidence/repo-cleanup/canary/remote-recovery-manifest.json \
            --classification=evidence/repo-cleanup/canary/live-classification.json \
            --out=evidence/repo-cleanup/canary/delete-preflight.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('evidence/repo-cleanup/canary/delete-preflight.json', 'utf8'));
          if (p.policy.blockers.length !== 0) throw new Error(JSON.stringify(p.policy.blockers));
          if (p.policy.deleteReady.length !== 85) throw new Error(`ready=${p.policy.deleteReady.length}`);
          if (p.policy.alreadyAbsent.length !== 1) throw new Error(`absent=${p.policy.alreadyAbsent.length}`);
          if (p.policy.alreadyAbsent[0].ref !== process.env.CANARY_REF) throw new Error('unexpected absent ref');
          if (p.archiveReachabilityCheckedTipCount !== 75) throw new Error(`archiveReachability=${p.archiveReachabilityCheckedTipCount}`);
          console.log('CANARY_POSTFLIGHT_PASS ready=85 absent=1 blockers=0 archiveReachability=75');
          NODE

      - name: Upload canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: repo-cleanup-canary-delete-evidence
          path: evidence/repo-cleanup/canary/
          if-no-files-found: error
