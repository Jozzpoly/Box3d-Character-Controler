name: Verify and deploy playground

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Smoke embodied-player mechanics
        run: npm run smoke
      - name: Capture E14 diagnostics
        if: github.ref != 'refs/heads/main'
        run: |
          node scripts/e14-1d-continuous-diagnostics.mjs e14-1d-diagnostics.json
          node scripts/e14-1e-preparation-coupling-crucible.mjs e14-1e-preparation-crucible.json
      - name: Upload E14 diagnostics
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: e14-continuous-diagnostics
          path: |
            e14-1d-diagnostics.json
            e14-1e-preparation-crucible.json
          if-no-files-found: error
      - name: Capture E15 gate diagnostics
        if: github.ref == 'refs/heads/experiment/e15-donor-physical-body-bridge'
        run: node scripts/e15-hybrid-gate-diagnostic.mjs --out=e15-hybrid-gate-diagnostic.json
      - name: Capture E15 world-contact causality
        if: github.ref == 'refs/heads/experiment/e15-donor-physical-body-bridge'
        run: node scripts/e15-world-contact-causality.mjs --out=e15-world-contact-causality.json
      - name: Test E15 contact-episode semantics
        if: github.ref == 'refs/heads/experiment/e15-donor-physical-body-bridge'
        run: node scripts/e15-contact-episode-semantics.mjs --out=e15-contact-episode-semantics.json
      - name: Qualify E15 V0 hybrid bridge
        if: github.ref == 'refs/heads/experiment/e15-donor-physical-body-bridge'
        run: node scripts/e15-hybrid-bridge-smoke.mjs --out=e15-hybrid-bridge.json
      - name: Qualify E15.1 contact-semantic bridge
        if: github.ref == 'refs/heads/experiment/e15-donor-physical-body-bridge'
        run: node scripts/e15-contact-semantic-smoke.mjs --out=e15-contact-semantic-smoke.json
      - name: Qualify E15 browser affordance ecology
        if: github.ref == 'refs/heads/experiment/e15-donor-physical-body-bridge'
        run: node scripts/e15-affordance-smoke.mjs --out=e15-affordance-smoke.json
      - name: Upload E15 hybrid evidence
        if: always() && github.ref == 'refs/heads/experiment/e15-donor-physical-body-bridge'
        uses: actions/upload-artifact@v4
        with:
          name: e15-hybrid-bridge
          path: |
            e15-hybrid-gate-diagnostic.json
            e15-world-contact-causality.json
            e15-contact-episode-semantics.json
            e15-hybrid-bridge.json
            e15-contact-semantic-smoke.json
            e15-affordance-smoke.json
          if-no-files-found: error
      - name: Probe E16 joint binding surface
        if: github.ref == 'refs/heads/experiment/e16-active-contact-organ'
        run: node scripts/e16-joint-api-probe.mjs --out=e16-joint-api-probe.json
      - name: Probe E16 contact identity surface
        if: github.ref == 'refs/heads/experiment/e16-active-contact-organ'
        run: node scripts/e16-contact-identity-probe.mjs --out=e16-contact-identity-probe.json
      - name: Run E16 active-contact-organ crucible
        if: github.ref == 'refs/heads/experiment/e16-active-contact-organ'
        run: node scripts/e16-active-contact-organ-crucible.mjs --out=e16-active-contact-organ-crucible.json
      - name: Diagnose E16.1 constraint transport
        if: github.ref == 'refs/heads/experiment/e16-active-contact-organ'
        run: node scripts/e16-grab-transport-diagnostic.mjs --out=e16-grab-transport-diagnostic.json
      - name: Capture E16.1 measurement-only grab baseline
        if: github.ref == 'refs/heads/experiment/e16-active-contact-organ'
        continue-on-error: true
        run: node scripts/e16-grab-pull-crucible.mjs --out=e16-grab-pull-crucible.json
      - name: Capture confounded E16.1b whole-episode A/B
        if: github.ref == 'refs/heads/experiment/e16-active-contact-organ'
        continue-on-error: true
        run: node scripts/e16-grab-transport-crucible.mjs --out=e16-grab-transport-crucible.json
      - name: Qualify isolated E16.1b constraint transport causal A/B
        if: github.ref == 'refs/heads/experiment/e16-active-contact-organ'
        run: node scripts/e16-grab-transport-causal-crucible.mjs --out=e16-grab-transport-causal-crucible.json
      - name: Upload E16 active-contact-organ evidence
        if: always() && github.ref == 'refs/heads/experiment/e16-active-contact-organ'
        uses: actions/upload-artifact@v4
        with:
          name: e16-active-contact-organ
          path: |
            e16-joint-api-probe.json
            e16-contact-identity-probe.json
            e16-active-contact-organ-crucible.json
            e16-grab-transport-diagnostic.json
            e16-grab-pull-crucible.json
            e16-grab-transport-crucible.json
            e16-grab-transport-causal-crucible.json
          if-no-files-found: error
      - name: Build playground
        run: npm run build
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
