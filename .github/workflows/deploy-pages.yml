name: Verify and deploy playground

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Smoke embodied-player mechanics
        run: npm run smoke
      - name: Capture E14 diagnostics
        if: github.ref != 'refs/heads/main'
        run: |
          node scripts/e14-1d-continuous-diagnostics.mjs e14-1d-diagnostics.json
          node scripts/e14-1e-preparation-coupling-crucible.mjs e14-1e-preparation-crucible.json
          node scripts/e14-1c-pinned-specimen-qualification.mjs --spec='e14c1|s1|m=1180|f=0.65|a=3|b=36|t=1000|p=natural-only' --out=e14-owner-pin-qualification.json
          node scripts/e14-owner-pin-braking-ablation.mjs e14-owner-pin-braking-ablation.json
      - name: Upload E14 diagnostics
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: e14-continuous-diagnostics
          path: |
            e14-1d-diagnostics.json
            e14-1e-preparation-crucible.json
            e14-owner-pin-qualification.json
            e14-owner-pin-braking-ablation.json
          if-no-files-found: error
      - name: Build playground
        run: npm run build
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
