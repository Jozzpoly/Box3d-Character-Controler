name: A5 query and lifecycle boundary crucible

on:
  push:
    branches:
      - research/donor-foundation-falsification-2026-09-10
    paths:
      - scripts/a5-query-lifecycle-boundary-crucible.mjs
      - scripts/a5-destroyed-support-child.mjs
      - .github/workflows/a5-query-lifecycle-boundary-crucible.yml
      - src/character.js
      - src/constraint-velocity-character.js
      - src/constraint-velocity.js
      - src/donor/**
      - src/e19/swept-grip-reach.js
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run A5 characterization
        run: node scripts/a5-query-lifecycle-boundary-crucible.mjs
      - name: Upload A5 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5-query-lifecycle-boundary-evidence
          path: tmp/a5/results.json
          retention-days: 90
          if-no-files-found: warn
