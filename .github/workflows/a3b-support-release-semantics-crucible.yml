name: A3b support-release semantics crucible

on:
  push:
    branches:
      - research/donor-foundation-falsification-2026-09-10
    paths:
      - scripts/a3b-support-release-semantics-crucible.mjs
      - .github/workflows/a3b-support-release-semantics-crucible.yml
      - src/character.js
      - src/constraint-velocity-character.js
      - src/constraint-velocity.js
      - src/donor/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run A3b characterization
        run: node scripts/a3b-support-release-semantics-crucible.mjs
      - name: Upload A3b evidence
        uses: actions/upload-artifact@v4
        with:
          name: a3b-support-release-semantics-evidence
          path: tmp/a3b/results.json
          retention-days: 90
