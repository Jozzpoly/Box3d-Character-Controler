name: E17 refactor qualification

on:
  push:
    branches:
      - maintenance/e17-manipulator-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Qualify baseline E17 intent-first manipulator
        run: node scripts/e17-intent-manipulator-smoke.mjs --out=e17-intent-manipulator-smoke.json
      - name: Qualify E17-depth point-mass manipulator
        run: node scripts/e17-point-mass-character-smoke.mjs --out=e17-point-mass-character-smoke.json
      - name: Build playground
        run: npm run build
      - name: Upload refactor evidence
        uses: actions/upload-artifact@v4
        with:
          name: e17-refactor-qualification
          path: |
            e17-intent-manipulator-smoke.json
            e17-point-mass-character-smoke.json
          if-no-files-found: error
