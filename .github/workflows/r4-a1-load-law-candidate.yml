name: R4 A1 load-law candidate

on:
  push:
    branches:
      - research/donor-foundation-repair-a1-design-2026-09-11
    paths:
      - scripts/r4-a1-load-law-candidate-crucible.mjs
      - .github/workflows/r4-a1-load-law-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compare A1 load-law candidates
        run: node scripts/r4-a1-load-law-candidate-crucible.mjs
      - name: Canonical smoke
        run: npm run smoke
      - name: Build runtime
        run: npm run build