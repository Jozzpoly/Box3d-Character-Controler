name: R1 A4 fixed-step camera basis crucible

on:
  push:
    branches:
      - research/donor-foundation-repair-a4-2026-09-10
      - research/foundation-invariant-a4-generalization-2026-09-10
    paths:
      - scripts/r1-a4-fixed-step-camera-basis-crucible.mjs
      - scripts/r1-a4-browser-integration-contract.mjs
      - scripts/r1-a4-presentation-isolation-stress.mjs
      - scripts/a4b-wall-clock-input-batching-crucible.mjs
      - scripts/a4c-input-temporal-contract-matrix.mjs
      - scripts/r2-temporal-policy-design-crucible.mjs
      - .github/workflows/r1-a4-fixed-step-camera-basis-crucible.yml
      - src/follow-camera.js
      - src/main.js
      - src/e19-owner-browser.js
      - src/player-input.js
      - src/character.js
      - src/constraint-velocity-character.js
      - src/constraint-velocity.js
      - src/donor/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify R1 A4 browser integration contract
        run: node scripts/r1-a4-browser-integration-contract.mjs
      - name: Run R1 A4 fixed-step camera basis crucible
        run: node scripts/r1-a4-fixed-step-camera-basis-crucible.mjs
      - name: Stress presentation isolation invariant
        run: node scripts/r1-a4-presentation-isolation-stress.mjs
      - name: Characterize wall-clock input batching boundary
        run: node scripts/a4b-wall-clock-input-batching-crucible.mjs
      - name: Characterize cross-input temporal batching
        run: node scripts/a4c-input-temporal-contract-matrix.mjs
      - name: Compare R2 temporal policies
        run: node scripts/r2-temporal-policy-design-crucible.mjs
      - name: Upload R1 A4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: r1-a4-fixed-step-camera-basis-evidence
          path: tmp/r1-a4/results.json
          retention-days: 90
