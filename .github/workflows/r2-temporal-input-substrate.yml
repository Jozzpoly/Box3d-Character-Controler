name: R2 temporal input substrate

on:
  push:
    branches:
      - research/temporal-input-substrate-r2-2026-09-10
    paths:
      - src/temporal-input-buffer.js
      - src/temporal-player-intent.js
      - src/temporal-frame-epoch.js
      - scripts/r2-temporal-input-buffer-contract.mjs
      - scripts/r2-temporal-input-buffer-stress.mjs
      - scripts/r2-temporal-intent-boundary-crucible.mjs
      - scripts/r2-late-delivery-reality-crucible.mjs
      - scripts/r2-discontinuity-policy-crucible.mjs
      - scripts/r2-tail-window-phase-stress.mjs
      - scripts/r2-frame-epoch-mapper-crucible.mjs
      - .github/workflows/r2-temporal-input-substrate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify temporal input buffer contract
        run: node scripts/r2-temporal-input-buffer-contract.mjs
      - name: Stress temporal input buffer against reference model
        run: node scripts/r2-temporal-input-buffer-stress.mjs
      - name: Verify temporal Donor intent boundary
        run: node scripts/r2-temporal-intent-boundary-crucible.mjs
      - name: Characterize late delivery and temporal discontinuity
        run: node scripts/r2-late-delivery-reality-crucible.mjs
      - name: Compare temporal discontinuity policies
        run: node scripts/r2-discontinuity-policy-crucible.mjs
      - name: Stress tail window across accumulator phases
        run: node scripts/r2-tail-window-phase-stress.mjs
      - name: Falsify isolated frame epoch mapper
        run: node scripts/r2-frame-epoch-mapper-crucible.mjs
