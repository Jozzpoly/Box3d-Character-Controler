name: Repo cleanup pre-prune archive tag witness

on:
  push:
    branches:
      - maintenance/repo-cleanup-adaptation-2026-09-09
    paths:
      - .github/workflows/repo-cleanup-pre-prune-tag-witness.yml

permissions:
  contents: write

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - name: Complete and verify pre-prune annotated tag witness
        id: witness
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repositoryId = 'R_kgDOUHjIFQ';
            const archiveBranch = 'archive/pre-cleanup-2026-09-09-dca388f4';
            const archiveSha = 'fd5cae330fb80280617ce7b241347f1edafdb875';
            const freezeSha256 = 'dca388f456480489492ea2069c2ce8ecd5930d3ab41028cda88f25fe72cc9584';
            const helperBranch = 'maintenance/repo-cleanup-adaptation-2026-09-09';
            const helperSha = context.sha;
            const tagName = 'archive/pre-cleanup-2026-09-09-dca388f4';
            const tagRef = `refs/tags/${tagName}`;
            const existingTagObjectSha = '7423e25ed9532f410a35cc4f7c3ff9c492a7fbc3';
            const rehearsalSha = '452f7b51a7e1b46b08ea74a21affeec33dbe0216';
            const rehearsalAliases = [
              'maintenance/repo-cleanup-shadow-rehearsal-2026-09-10',
              'maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-backup',
              'maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-final',
              'maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-run',
              'maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-v2',
              'maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-v3',
              'maintenance/repo-cleanup-shadow-rehearsal-2026-09-10-v4',
            ];

            const manifestResponse = await github.rest.repos.getContent({
              owner, repo, path: 'archive/recovery-manifest.json', ref: archiveBranch,
            });
            if (Array.isArray(manifestResponse.data) || !manifestResponse.data.content) throw new Error('Recovery manifest missing');
            const manifest = JSON.parse(Buffer.from(manifestResponse.data.content, 'base64').toString('utf8'));
            if (manifest.historicalArchiveFreezeSha256 !== freezeSha256) throw new Error('Freeze hash mismatch');
            if (manifest.canonicalSha !== 'b0eac372035ca12a63f808eb3201edd3605a163c') throw new Error('Canonical manifest SHA mismatch');
            if (manifest.historicalBranchCount !== 86 || manifest.historicalBranches.length !== 86) throw new Error('Historical manifest count mismatch');

            async function branches() {
              const rows = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
              return rows.map((b) => ({ name: b.name, oid: b.commit.sha })).sort((a,b) => a.name.localeCompare(b.name));
            }
            const before = await branches();
            const byName = new Map(before.map((b) => [b.name, b.oid]));
            const historicalNames = new Set();
            let exactHistorical = 0;
            let expectedAbsent = 0;
            const problems = [];
            for (const entry of manifest.historicalBranches) {
              const name = entry.ref.replace(/^refs\/heads\//, '');
              historicalNames.add(name);
              const current = byName.get(name);
              if (name === 'tmp-noop') {
                if (current === undefined) expectedAbsent++;
                else problems.push({ name, expected: 'ABSENT', current });
              } else if (current === entry.expectedSha) exactHistorical++;
              else problems.push({ name, expected: entry.expectedSha, current: current || 'ABSENT' });
            }
            if (exactHistorical !== 85 || expectedAbsent !== 1 || problems.length) {
              throw new Error(`Frozen historical precondition failed: ${JSON.stringify({exactHistorical, expectedAbsent, problems})}`);
            }
            for (const alias of rehearsalAliases) {
              if (byName.get(alias) !== rehearsalSha) throw new Error(`Rehearsal alias mismatch: ${alias}`);
            }
            if (byName.get('main') !== manifest.canonicalSha) throw new Error(`main drift: ${byName.get('main')}`);
            if (byName.get(archiveBranch) !== archiveSha) throw new Error(`archive drift: ${byName.get(archiveBranch)}`);
            if (byName.get(helperBranch) !== helperSha) throw new Error(`helper drift: ${byName.get(helperBranch)}`);

            const expectedNames = new Set([
              ...[...historicalNames].filter((n) => n !== 'tmp-noop'),
              ...rehearsalAliases,
              'main', archiveBranch, helperBranch,
            ]);
            const unknownHeads = before.filter((b) => !expectedNames.has(b.name));
            const missingHeads = [...expectedNames].filter((n) => !byName.has(n));
            if (expectedNames.size !== 95 || before.length !== 95 || unknownHeads.length || missingHeads.length) {
              throw new Error(`Namespace mismatch: ${JSON.stringify({expected: expectedNames.size, actual: before.length, unknownHeads, missingHeads})}`);
            }

            let tagRefBefore = null;
            try {
              tagRefBefore = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tagName}` })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagRefBefore) throw new Error(`Tag ref already exists unexpectedly: ${tagRefBefore.object.sha}`);

            const tagObject = (await github.rest.git.getTag({ owner, repo, tag_sha: existingTagObjectSha })).data;
            if (tagObject.sha !== existingTagObjectSha) throw new Error('Recovered tag object SHA mismatch');
            if (tagObject.tag !== tagName) throw new Error(`Recovered tag name mismatch: ${tagObject.tag}`);
            if (tagObject.object.type !== 'commit' || tagObject.object.sha !== archiveSha) throw new Error(`Recovered tag peel mismatch: ${JSON.stringify(tagObject.object)}`);
            if (!tagObject.message.includes(freezeSha256) || !tagObject.message.includes('archive/recovery-manifest.json')) {
              throw new Error('Recovered tag annotation lacks required provenance');
            }

            const mutation = `mutation GuardHeads($input: UpdateRefsInput!) { updateRefs(input: $input) { clientMutationId } }`;
            const retainedHeads = before.map((b) => ({
              name: `refs/heads/${b.name}`,
              beforeOid: b.oid,
              afterOid: b.oid,
            }));
            await github.graphql(mutation, {
              input: {
                repositoryId,
                clientMutationId: 'pre-prune-tag-95-head-guard',
                refUpdates: retainedHeads,
              },
            });

            const createdRef = (await github.rest.git.createRef({
              owner,
              repo,
              ref: tagRef,
              sha: existingTagObjectSha,
            })).data;
            if (createdRef.object.sha !== existingTagObjectSha || createdRef.object.type !== 'tag') {
              throw new Error(`Created tag ref mismatch: ${JSON.stringify(createdRef.object)}`);
            }

            const verifiedRef = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tagName}` })).data;
            const verifiedTag = (await github.rest.git.getTag({ owner, repo, tag_sha: verifiedRef.object.sha })).data;
            if (verifiedRef.object.sha !== existingTagObjectSha || verifiedRef.object.type !== 'tag') throw new Error('Verified tag ref mismatch');
            if (verifiedTag.object.sha !== archiveSha || verifiedTag.object.type !== 'commit') throw new Error('Verified peeled target mismatch');
            if (!verifiedTag.message.includes(freezeSha256) || !verifiedTag.message.includes('archive/recovery-manifest.json')) throw new Error('Verified annotation mismatch');

            const after = await branches();
            const branchNamespaceUnchanged = JSON.stringify(after) === JSON.stringify(before);
            if (!branchNamespaceUnchanged) throw new Error('Branch namespace changed during additive tag repair');

            const evidence = {
              tagName,
              tagRef,
              tagObjectSha: verifiedRef.object.sha,
              tagObjectType: verifiedRef.object.type,
              peeledArchiveCommitSha: verifiedTag.object.sha,
              peeledType: verifiedTag.object.type,
              archiveSha,
              canonicalSha: manifest.canonicalSha,
              helperSha,
              freezeSha256,
              recoveryManifest: 'archive/recovery-manifest.json',
              historicalExactLive: exactHistorical,
              historicalExpectedAbsent: expectedAbsent,
              branchCountBefore: before.length,
              branchCountAfter: after.length,
              retainedHeadGuardEntries: retainedHeads.length,
              branchNamespaceUnchanged,
              refCreationMechanism: 'REST createRef after successful 95-head GraphQL retained-state guard; additive repair only',
              transactionBoundary: 'Annotated TAG object OIDs are rejected by updateRefs; tag ref is therefore verified outside the future branch-delete transaction.',
              tagMessage: verifiedTag.message,
            };
            fs.writeFileSync('pre-prune-archive-tag-witness.json', JSON.stringify(evidence, null, 2));
            core.info(`PRE_PRUNE_TAG_WITNESS tagObject=${verifiedRef.object.sha} peeled=${verifiedTag.object.sha} branches=${after.length} historicalExact=${exactHistorical} absent=${expectedAbsent} retainedGuard=${retainedHeads.length} unchanged=${branchNamespaceUnchanged}`);

      - name: Upload tag witness evidence
        uses: actions/upload-artifact@v4
        with:
          name: repo-cleanup-pre-prune-archive-tag-witness
          path: pre-prune-archive-tag-witness.json
          if-no-files-found: error
          retention-days: 90
