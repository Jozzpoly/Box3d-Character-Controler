name: Repo cleanup archive materialization

on:
  push:
    branches:
      - maintenance/repo-cleanup-adaptation-2026-09-09
    paths:
      - .github/workflows/repo-cleanup-archive-materialize.yml

permissions:
  contents: write

concurrency:
  group: repo-cleanup-archive-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      CLEANUP_CANONICAL_REF: main
      CLEANUP_ACTIVE_BRANCH: maintenance/repo-cleanup-adaptation-2026-09-09
      CLEANUP_ARCHIVE_BRANCH: archive/pre-cleanup-2026-09-09-dca388f4
      EXPECTED_CANONICAL_SHA: b0eac372035ca12a63f808eb3201edd3605a163c
      EXPECTED_FREEZE_SHA: dca388f456480489492ea2069c2ce8ecd5930d3ab41028cda88f25fe72cc9584
      EXPECTED_ANCHOR_SHA: fd5cae330fb80280617ce7b241347f1edafdb875
      EXPECTED_HISTORICAL_BRANCHES: '86'
      EXPECTED_HISTORICAL_TIPS: '75'
      EXPECTED_ANCHOR_PARENTS: '76'

    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch complete branch and PR-head graph
        run: |
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Recompute and qualify frozen preservation contract
        run: |
          mkdir -p evidence/repo-cleanup/archive-materialization
          node scripts/repo-cleanup-gate1-classify.mjs \
            --out=evidence/repo-cleanup/archive-materialization/pre-classification.json
          node scripts/repo-cleanup-gate1-plan.mjs \
            --in=evidence/repo-cleanup/archive-materialization/pre-classification.json \
            --out=evidence/repo-cleanup/archive-materialization/pre-plan.json
          node scripts/repo-cleanup-archive-qualify.mjs \
            --plan=evidence/repo-cleanup/archive-materialization/pre-plan.json \
            --out=evidence/repo-cleanup/archive-materialization/pre-qualification.json

      - name: Fail closed unless preflight exactly matches frozen authority
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const classification = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/pre-classification.json', 'utf8'));
          const plan = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/pre-plan.json', 'utf8'));
          const qualification = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/pre-qualification.json', 'utf8'));
          const env = process.env;
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          assert(classification.canonicalSha === env.EXPECTED_CANONICAL_SHA, `canonical moved: ${classification.canonicalSha}`);
          assert(plan.historicalArchiveFreezeSha256 === env.EXPECTED_FREEZE_SHA, `freeze mismatch: ${plan.historicalArchiveFreezeSha256}`);
          assert(plan.historicalArchiveBranchCount === Number(env.EXPECTED_HISTORICAL_BRANCHES), 'historical branch count mismatch');
          assert(plan.historicalArchiveTipCount === Number(env.EXPECTED_HISTORICAL_TIPS), 'historical tip count mismatch');
          assert(plan.archiveAnchorParentShas.length === Number(env.EXPECTED_ANCHOR_PARENTS), 'anchor parent count mismatch');
          assert(qualification.status === 'PASS_LOCAL_ONLY_NO_REMOTE_REF', `qualification status ${qualification.status}`);
          assert(qualification.anchorSha === env.EXPECTED_ANCHOR_SHA, `anchor mismatch: ${qualification.anchorSha}`);
          assert(qualification.verifiedHistoricalReachableTipCount === Number(env.EXPECTED_HISTORICAL_TIPS), 'reachability count mismatch');
          assert(qualification.remoteWritePerformed === false, 'qualification unexpectedly reports remote write');
          if (plan.targetArchivePresent) {
            assert(plan.targetArchiveSha === env.EXPECTED_ANCHOR_SHA, `existing archive has wrong SHA in plan: ${plan.targetArchiveSha}`);
          }
          console.log(`PREFLIGHT_PASS canonical=${classification.canonicalSha} freeze=${plan.historicalArchiveFreezeSha256} anchor=${qualification.anchorSha}`);
          NODE

      - name: CAS-check live refs and materialize archive if absent
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          canonical_remote="$(git ls-remote --heads origin "refs/heads/${CLEANUP_CANONICAL_REF}" | cut -f1)"
          helper_remote="$(git ls-remote --heads origin "refs/heads/${CLEANUP_ACTIVE_BRANCH}" | cut -f1)"
          archive_remote="$(git ls-remote --heads origin "refs/heads/${CLEANUP_ARCHIVE_BRANCH}" | cut -f1)"

          if [[ "${canonical_remote}" != "${EXPECTED_CANONICAL_SHA}" ]]; then
            echo "canonical CAS failed: ${canonical_remote}" >&2
            exit 1
          fi

          if [[ -n "${archive_remote}" ]]; then
            if [[ "${archive_remote}" != "${EXPECTED_ANCHOR_SHA}" ]]; then
              echo "archive ref exists at unexpected SHA: ${archive_remote}" >&2
              exit 1
            fi
            echo "Archive already exists at expected anchor; treating materialization as idempotent."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "${helper_remote}" != "${GITHUB_SHA}" ]]; then
              echo "helper CAS failed before first archive write: remote=${helper_remote} workflow=${GITHUB_SHA}" >&2
              exit 1
            fi
            local_anchor="$(node -p "JSON.parse(require('fs').readFileSync('evidence/repo-cleanup/archive-materialization/pre-qualification.json','utf8')).anchorSha")"
            if [[ "${local_anchor}" != "${EXPECTED_ANCHOR_SHA}" ]]; then
              echo "local anchor changed before push: ${local_anchor}" >&2
              exit 1
            fi
            git push origin "${local_anchor}:refs/heads/${CLEANUP_ARCHIVE_BRANCH}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          archive_after="$(git ls-remote --heads origin "refs/heads/${CLEANUP_ARCHIVE_BRANCH}" | cut -f1)"
          if [[ "${archive_after}" != "${EXPECTED_ANCHOR_SHA}" ]]; then
            echo "remote archive verification failed: ${archive_after}" >&2
            exit 1
          fi
          echo "REMOTE_ARCHIVE_PRESENT ref=refs/heads/${CLEANUP_ARCHIVE_BRANCH} sha=${archive_after}"

      - name: Refetch post-materialization graph
        run: |
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: Reclassify and requalify with archive present
        run: |
          node scripts/repo-cleanup-gate1-classify.mjs \
            --out=evidence/repo-cleanup/archive-materialization/post-classification.json
          node scripts/repo-cleanup-gate1-plan.mjs \
            --in=evidence/repo-cleanup/archive-materialization/post-classification.json \
            --out=evidence/repo-cleanup/archive-materialization/post-plan.json
          node scripts/repo-cleanup-archive-qualify.mjs \
            --plan=evidence/repo-cleanup/archive-materialization/post-plan.json \
            --out=evidence/repo-cleanup/archive-materialization/post-qualification.json

      - name: Verify stable freeze and KEEP_ARCHIVE terminal semantics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const prePlan = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/pre-plan.json', 'utf8'));
          const postClassification = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/post-classification.json', 'utf8'));
          const postPlan = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/post-plan.json', 'utf8'));
          const postQualification = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/post-qualification.json', 'utf8'));
          const env = process.env;
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          const archiveRef = `refs/heads/${env.CLEANUP_ARCHIVE_BRANCH}`;
          const helperRef = `refs/heads/${env.CLEANUP_ACTIVE_BRANCH}`;
          const archiveRecord = postPlan.records.find((record) => record.ref === archiveRef);
          const helperRecord = postPlan.records.find((record) => record.ref === helperRef);
          const canonicalRecord = postPlan.records.find((record) => record.ref === postPlan.canonicalRef);
          const candidateCount = postPlan.records.filter((record) => record.preliminaryDisposition === 'ARCHIVE_THEN_DELETE_CANDIDATE').length;

          assert(postClassification.canonicalSha === env.EXPECTED_CANONICAL_SHA, 'postflight canonical moved');
          assert(postPlan.historicalArchiveFreezeSha256 === env.EXPECTED_FREEZE_SHA, 'postflight freeze changed');
          assert(postPlan.historicalArchiveFreezeSha256 === prePlan.historicalArchiveFreezeSha256, 'pre/post freeze differs');
          assert(postPlan.historicalArchiveBranchCount === Number(env.EXPECTED_HISTORICAL_BRANCHES), 'postflight historical branch count changed');
          assert(postPlan.historicalArchiveTipCount === Number(env.EXPECTED_HISTORICAL_TIPS), 'postflight historical tips changed');
          assert(postPlan.archiveAnchorParentShas.length === Number(env.EXPECTED_ANCHOR_PARENTS), 'postflight parent count changed');
          assert(postPlan.targetArchivePresent === true, 'archive absent from postflight plan');
          assert(postPlan.targetArchiveSha === env.EXPECTED_ANCHOR_SHA, `postflight archive SHA ${postPlan.targetArchiveSha}`);
          assert(archiveRecord?.preliminaryDisposition === 'KEEP_ARCHIVE', `archive disposition ${archiveRecord?.preliminaryDisposition}`);
          assert(helperRecord?.preliminaryDisposition === 'KEEP_UNTIL_CLOSURE', `helper disposition ${helperRecord?.preliminaryDisposition}`);
          assert(canonicalRecord?.preliminaryDisposition === 'KEEP', `canonical disposition ${canonicalRecord?.preliminaryDisposition}`);
          assert(candidateCount === Number(env.EXPECTED_HISTORICAL_BRANCHES), `candidate count ${candidateCount}`);
          assert(postQualification.status === 'PASS_LOCAL_ONLY_NO_REMOTE_REF', `post qualification ${postQualification.status}`);
          assert(postQualification.anchorSha === env.EXPECTED_ANCHOR_SHA, `post anchor changed: ${postQualification.anchorSha}`);
          assert(postQualification.verifiedHistoricalReachableTipCount === Number(env.EXPECTED_HISTORICAL_TIPS), 'post reachability mismatch');
          console.log(`POSTFLIGHT_PASS branches=${postClassification.branchCount} freeze=${postPlan.historicalArchiveFreezeSha256} archive=${postPlan.targetArchiveSha} disposition=${archiveRecord.preliminaryDisposition}`);
          NODE

      - name: Recover and verify manifest from remote archive tree
        run: |
          git show "refs/remotes/origin/${CLEANUP_ARCHIVE_BRANCH}:archive/recovery-manifest.json" \
            > evidence/repo-cleanup/archive-materialization/remote-recovery-manifest.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/remote-recovery-manifest.json', 'utf8'));
          const env = process.env;
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          assert(manifest.historicalArchiveFreezeSha256 === env.EXPECTED_FREEZE_SHA, 'remote manifest freeze mismatch');
          assert(manifest.canonicalSha === env.EXPECTED_CANONICAL_SHA, 'remote manifest canonical mismatch');
          assert(manifest.historicalBranchCount === Number(env.EXPECTED_HISTORICAL_BRANCHES), 'remote manifest branch count mismatch');
          assert(manifest.historicalDistinctTipCount === Number(env.EXPECTED_HISTORICAL_TIPS), 'remote manifest tip count mismatch');
          assert(manifest.archiveAnchorParentShas.length === Number(env.EXPECTED_ANCHOR_PARENTS), 'remote manifest parent count mismatch');
          console.log(`REMOTE_MANIFEST_PASS branches=${manifest.historicalBranchCount} tips=${manifest.historicalDistinctTipCount}`);
          NODE

      - name: Write materialization result
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const post = JSON.parse(fs.readFileSync('evidence/repo-cleanup/archive-materialization/post-plan.json', 'utf8'));
          const result = {
            schema: 'box3d-character-controller-remote-archive-materialization-v1',
            status: 'PASS_REMOTE_ARCHIVE_PRESENT_NO_DELETIONS',
            repository: 'Jozzpoly/Box3d-Character-Controler',
            canonicalSha: process.env.EXPECTED_CANONICAL_SHA,
            historicalArchiveFreezeSha256: process.env.EXPECTED_FREEZE_SHA,
            archiveRef: `refs/heads/${process.env.CLEANUP_ARCHIVE_BRANCH}`,
            archiveSha: process.env.EXPECTED_ANCHOR_SHA,
            helperWorkflowSha: process.env.GITHUB_SHA,
            historicalBranchCount: post.historicalArchiveBranchCount,
            historicalDistinctTipCount: post.historicalArchiveTipCount,
            archiveAnchorParentCount: post.archiveAnchorParentShas.length,
            destructiveActionsPerformed: 0,
          };
          fs.writeFileSync('evidence/repo-cleanup/archive-materialization/materialization-result.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(`MATERIALIZATION_PASS archive=${result.archiveRef}@${result.archiveSha} deletions=0`);
          NODE

      - name: Upload remote archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: repo-cleanup-remote-archive-evidence
          path: evidence/repo-cleanup/archive-materialization/
          if-no-files-found: error
