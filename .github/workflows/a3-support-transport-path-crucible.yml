name: A3 support-transport path crucible

on:
  push:
    branches:
      - research/donor-foundation-falsification-2026-09-10
    paths:
      - scripts/a3-support-transport-path-crucible.mjs
      - .github/workflows/a3-support-transport-path-crucible.yml
      - src/character.js
      - src/constraint-velocity-character.js
      - src/constraint-velocity.js
      - src/donor/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run A3 characterization
        run: node scripts/a3-support-transport-path-crucible.mjs
      - name: Upload A3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: a3-support-transport-path-evidence
          path: tmp/a3/results.json
          retention-days: 90
