name: R2 runtime shadow observer

on:
  push:
    branches:
      - research/temporal-input-runtime-shadow-r2-2026-09-11
    paths:
      - src/temporal-*.js
      - src/main.js
      - scripts/r2-*.mjs
      - .github/workflows/r2-runtime-shadow-observer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify qualified R2 substrate stack
        run: |
          node scripts/r2-temporal-input-buffer-contract.mjs
          node scripts/r2-temporal-input-buffer-stress.mjs
          node scripts/r2-temporal-intent-boundary-crucible.mjs
          node scripts/r2-late-delivery-reality-crucible.mjs
          node scripts/r2-discontinuity-policy-crucible.mjs
          node scripts/r2-tail-window-phase-stress.mjs
          node scripts/r2-frame-epoch-mapper-crucible.mjs
          node scripts/r2-browser-delivery-specimen.mjs
          node scripts/r2-late-delivery-policy-crucible.mjs
          node scripts/r2-intent-age-semantics-crucible.mjs
          node scripts/r2-context-dependent-late-edge-crucible.mjs
          node scripts/r2-temporal-intent-policy-crucible.mjs
          node scripts/r2-real-input-shadow-contract.mjs
          node scripts/r2-real-input-timeline-probe-crucible.mjs
      - name: Verify runtime shadow observer
        run: node scripts/r2-runtime-shadow-observer-contract.mjs
      - name: Build runtime
        run: npm run build
