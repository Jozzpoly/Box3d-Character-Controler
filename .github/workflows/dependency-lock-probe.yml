name: Dependency lock probe

on:
  push:
    branches:
      - maintenance/dependency-lock-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Generate lockfile through a full install
        run: npm install --no-audit --no-fund
      - name: Build installed graph
        run: npm run build
      - name: Record toolchain and native Rollup
        run: |
          node --version > dependency-toolchain.txt
          npm --version >> dependency-toolchain.txt
          npm ls @rollup/rollup-linux-x64-gnu --all > dependency-rollup.txt
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-lock
          path: |
            package-lock.json
            dependency-toolchain.txt
            dependency-rollup.txt
          if-no-files-found: error

  reproduce-plain:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-lock
          path: lock-artifact
      - name: Install artifact lockfile
        run: cp lock-artifact/package-lock.json package-lock.json
      - name: Fresh npm ci
        run: npm ci --no-audit --no-fund
      - name: Require native Rollup
        run: test -d node_modules/@rollup/rollup-linux-x64-gnu
      - name: Build reproduced graph
        run: npm run build

  reproduce-include-optional:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-lock
          path: lock-artifact
      - name: Install artifact lockfile
        run: cp lock-artifact/package-lock.json package-lock.json
      - name: Fresh npm ci including optional dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Require native Rollup
        run: test -d node_modules/@rollup/rollup-linux-x64-gnu
      - name: Build reproduced graph
        run: npm run build
