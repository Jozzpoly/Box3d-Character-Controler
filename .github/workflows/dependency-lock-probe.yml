name: Dependency lock probe

on:
  push:
    branches:
      - maintenance/dependency-lock-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Generate lockfile through a full install
        run: npm install --no-audit --no-fund
      - name: Build from installed graph
        run: npm run build
      - name: Record installed native Rollup package
        run: |
          test -d node_modules/@rollup/rollup-linux-x64-gnu
          npm ls @rollup/rollup-linux-x64-gnu --all > dependency-rollup.txt
      - name: Reinstall strictly from generated lockfile
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
      - name: Build from reproduced graph
        run: npm run build
      - name: Record toolchain
        run: |
          node --version > dependency-toolchain.txt
          npm --version >> dependency-toolchain.txt
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-probe
          path: |
            package-lock.json
            dependency-toolchain.txt
            dependency-rollup.txt
          if-no-files-found: warn
