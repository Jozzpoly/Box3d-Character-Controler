name: R4 A2 plane-order design

on:
  push:
    branches:
      - research/donor-foundation-repair-a2-design-2026-09-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Characterize A2 plane-order behavior
        run: node scripts/r4-a2-plane-order-crucible.mjs
      - name: Protect A2 feasible-region invariant
        run: node scripts/r4-a2-feasible-region-contract.mjs
      - name: Reproduce A2 on real CollideMover planes
        run: node scripts/r4-a2-runtime-plane-order-witness.mjs
      - name: Canonical smoke
        run: npm run smoke
      - name: Build runtime
        run: npm run build
