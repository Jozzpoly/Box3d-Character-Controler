name: R1 A4 browser integration executor

on:
  push:
    branches:
      - research/donor-foundation-repair-a4-2026-09-10
    paths:
      - .github/workflows/r1-a4-browser-integration-executor.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Exact preflight and bounded patch
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='fe307d866084a69804fdd684a6e230f6c683f0d5'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/main.js',
              '    const basis = followCamera.basis();\n    const intent = playerInput.sample(basis);',
              '    const basis = followCamera.controlBasis();\n    const intent = playerInput.sample(basis);',
          )
          replace_once(
              'src/main.js',
              '    character.postStep(dt);\n    capture?.record(intent);',
              '    character.postStep(dt);\n    capture?.record(intent);\n    followCamera.advanceControl(dt);',
          )
          replace_once(
              'src/e19-owner-browser.js',
              '  function aimForHand(hand) {\n    const basis = followCamera.basis();',
              '  function aimForHand(hand, basis = followCamera.basis()) {',
          )
          replace_once(
              'src/e19-owner-browser.js',
              '  function updateReachAndAcquire(hand) {\n    const aim = aimForHand(hand);',
              '  function updateReachAndAcquire(hand, basis) {\n    const aim = aimForHand(hand, basis);',
          )
          replace_once(
              'src/e19-owner-browser.js',
              '    const basis = followCamera.basis();\n    const intent = playerInput.sample(basis);',
              '    const basis = followCamera.controlBasis();\n    const intent = playerInput.sample(basis);',
          )
          replace_once(
              'src/e19-owner-browser.js',
              '    for (const hand of hands) updateReachAndAcquire(hand);',
              '    for (const hand of hands) updateReachAndAcquire(hand, basis);',
          )
          replace_once(
              'src/e19-owner-browser.js',
              '    b3.b3World_Step(playground.world, dt, SUBSTEPS);\n    character.postStep(dt);',
              '    b3.b3World_Step(playground.world, dt, SUBSTEPS);\n    character.postStep(dt);\n    followCamera.advanceControl(dt);',
          )
          replace_once(
              '.github/workflows/r1-a4-fixed-step-camera-basis-crucible.yml',
              '      - src/follow-camera.js\n',
              '      - src/follow-camera.js\n      - src/main.js\n      - src/e19-owner-browser.js\n',
          )

          main = Path('src/main.js').read_text()
          e19 = Path('src/e19-owner-browser.js').read_text()
          if main.count('const basis = followCamera.controlBasis();') != 1:
              raise SystemExit('main: fixed-step basis integration count mismatch')
          if main.count('followCamera.advanceControl(dt);') != 1:
              raise SystemExit('main: fixed-step advance integration count mismatch')
          if e19.count('const basis = followCamera.controlBasis();') != 1:
              raise SystemExit('E19: fixed-step basis integration count mismatch')
          if e19.count('followCamera.advanceControl(dt);') != 1:
              raise SystemExit('E19: fixed-step advance integration count mismatch')
          if e19.count('updateReachAndAcquire(hand, basis)') != 2:
              raise SystemExit('E19: mechanical reach basis plumbing mismatch')
          if e19.count('function aimForHand(hand, basis = followCamera.basis())') != 1:
              raise SystemExit('E19: visual preview basis boundary mismatch')
          print('R1 browser integration exact patch contract PASS')
          PY
          rm .github/workflows/r1-a4-browser-integration-executor.yml
          git diff --check
          changed="$(git status --short | sed -E 's/^...//' | sort)"
          expected="$(printf '%s\n' '.github/workflows/r1-a4-browser-integration-executor.yml' '.github/workflows/r1-a4-fixed-step-camera-basis-crucible.yml' 'src/e19-owner-browser.js' 'src/main.js' | sort)"
          test "$changed" = "$expected"
      - name: Commit bounded integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate R1 fixed-step camera basis into browser runtimes'
          git push origin HEAD:research/donor-foundation-repair-a4-2026-09-10
