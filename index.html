<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#aebfc8" />
    <title>Box3D Character Controler — E2 Authority Ownership</title>
  </head>
  <body>
    <canvas id="app"></canvas>
    <section id="hud" aria-label="controls">
      <div class="eyebrow" id="phase">EMBODIED PLAYER · E2</div>
      <div class="controls"><strong>WASD</strong> move · <strong>Space</strong> jump · <strong>Shift</strong> sprint · <strong>Drag</strong> camera · <strong>Wheel</strong> zoom</div>
      <div class="secondary"><strong>1</strong> H-A controller-owned · <strong>2</strong> E2 solver-owned · <strong>R</strong> reset · <strong>H</strong> causal telemetry</div>
      <div id="status">Loading…</div>
    </section>
    <section id="debug" hidden aria-label="debug telemetry">
      <div><span>speed</span><strong id="d-speed">—</strong></div>
      <div><span id="l-external">external</span><strong id="d-external">—</strong></div>
      <div><span>vertical</span><strong id="d-vertical">—</strong></div>
      <div><span>support</span><strong id="d-support">—</strong></div>
      <div><span>dynamic contacts</span><strong id="d-contacts">—</strong></div>
      <div><span id="l-impulse">contact impulse</span><strong id="d-impulse">—</strong></div>
      <div><span id="l-transport">support transport</span><strong id="d-transport">—</strong></div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
